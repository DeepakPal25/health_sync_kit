name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart:
    name: Analyze & test (Dart)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --coverage
      - run: dart pub publish --dry-run

  android:
    name: Build example (Android)
    runs-on: ubuntu-latest
    needs: dart
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders
        working-directory: example
        run: flutter create --platforms=android .
      - name: Raise minSdk to 26 (Health Connect)
        working-directory: example
        run: sed -i -E 's/minSdk(Version)? *=? *flutter\.minSdkVersion/minSdk = 26/' android/app/build.gradle*
      - name: Build APK
        working-directory: example
        run: flutter build apk --debug

  ios:
    name: Build example (iOS)
    runs-on: macos-15
    needs: dart
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders
        working-directory: example
        run: flutter create --platforms=ios .
      - name: Build (no codesign)
        working-directory: example
        run: flutter build ios --debug --no-codesign
