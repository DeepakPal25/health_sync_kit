name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart:
    name: Analyze & test (Dart)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.5
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --coverage
      - run: dart pub publish --dry-run

  android:
    name: Build example (Android)
    runs-on: ubuntu-latest
    needs: dart
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Cache Gradle deps so we don't re-download from Maven Central every
      # run (shared runner IPs get HTTP 429 rate-limited there).
      - uses: gradle/actions/setup-gradle@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.5
          cache: true
      - name: Generate platform folders
        working-directory: example
        run: flutter create --platforms=android .
      - name: Raise minSdk to 26 (Health Connect)
        working-directory: example
        run: sed -i -E 's/minSdk(Version)? *=? *flutter\.minSdkVersion/minSdk = 26/' android/app/build.gradle*
      - name: Build APK
        working-directory: example
        # Retry with backoff: transient 429s from Maven Central are common.
        run: |
          for attempt in 1 2 3; do
            flutter build apk --debug && exit 0
            echo "Build failed (attempt $attempt), retrying in $((attempt * 60))s..."
            sleep $((attempt * 60))
          done
          exit 1

  ios:
    name: Build example (iOS)
    runs-on: macos-15
    needs: dart
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.5
          cache: true
      - name: Generate platform folders
        working-directory: example
        run: flutter create --platforms=ios .
      - name: Build (no codesign)
        working-directory: example
        run: flutter build ios --debug --no-codesign
