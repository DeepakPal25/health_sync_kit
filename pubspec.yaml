name: health_sync_kit
description: >-
  HealthKit and Health Connect for Flutter with built-in analytics:
  de-duplicated daily stats, incremental sync, sleep score, readiness,
  streaks and training load.
version: 0.1.2
homepage: https://github.com/DeepakPal25/health_sync_kit
repository: https://github.com/DeepakPal25/health_sync_kit
issue_tracker: https://github.com/DeepakPal25/health_sync_kit/issues
topics:
  - health
  - healthkit
  - health-connect
  - fitness
  - analytics

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.deepakpal.health_sync_kit
        pluginClass: HealthSyncKitPlugin
      ios:
        pluginClass: HealthSyncKitPlugin
